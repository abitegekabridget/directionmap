<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Uganda Direction Map</title>

    <!-- =========================================
         LEAFLET CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <!-- =========================================
         YOUR CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <!-- =========================================
         TOP NAVIGATION
    ========================================== -->

    <header class="navbar">

        <div class="brand">

            <div class="brand-icon">
                🧭
            </div>

            <div>

                <div class="brand-title">
                    Route Direction Map
                </div>

                <div class="brand-subtitle">
                    East &amp; West Bound
                </div>

            </div>

        </div>

    </header>


    <!-- =========================================
         MAIN
    ========================================== -->

    <main>

        <!-- =====================================
             MAP
        ====================================== -->

        <div id="map"></div>


        <!-- =====================================
             SEARCH CARD
        ====================================== -->

        <div class="search-card">

            <div class="card-title">
                Plan your journey
            </div>

            <div class="card-subtitle">
                Search any location in Uganda
            </div>


            <!-- =================================
                 FROM LOCATION
            ================================== -->

            <div class="location-input">

                <div class="input-icon from-icon">
                    A
                </div>

                <div class="input-wrapper">

                    <label for="fromInput">
                        FROM
                    </label>

                    <input
                        type="text"
                        id="fromInput"
                        placeholder="Starting location"
                        autocomplete="off"
                    >

                    <div
                        id="fromResults"
                        class="search-results">
                    </div>

                </div>

            </div>


            <!-- =================================
                 SWAP BUTTON
            ================================== -->

            <button
                id="swapBtn"
                class="swap-btn"
                type="button"
                title="Swap departure and destination"
                aria-label="Swap departure and destination"
            >

                <span class="swap-icon">
                    ⇅
                </span>

                <span class="swap-text">
                    Swap
                </span>

            </button>


            <!-- =================================
                 TO LOCATION
            ================================== -->

            <div class="location-input">

                <div class="input-icon to-icon">
                    B
                </div>

                <div class="input-wrapper">

                    <label for="toInput">
                        TO
                    </label>

                    <input
                        type="text"
                        id="toInput"
                        placeholder="Destination"
                        autocomplete="off"
                    >

                    <div
                        id="toResults"
                        class="search-results">
                    </div>

                </div>

            </div>


            <!-- =================================
                 CALCULATE BUTTON
            ================================== -->

            <button
                id="calculateBtn"
                class="calculate-btn"
                type="button"
            >

                <span>
                    Calculate Direction
                </span>

                <span>
                    →
                </span>

            </button>


            <!-- =================================
                 CLEAR BUTTON
            ================================== -->

            <button
                id="clearBtn"
                class="clear-btn"
                type="button"
            >
                Clear Route
            </button>

        </div>


        <!-- =====================================
             RESULT CARD
        ====================================== -->

        <div
            id="resultCard"
            class="result-card hidden"
        >

            <!-- RESULT HEADER -->

            <div class="result-header">

                <div>

                    <div class="result-label">
                        TRAVEL DIRECTION
                    </div>

                    <div
                        id="directionResult"
                        class="direction-result"
                    >
                        -
                    </div>

                </div>


                <div
                    id="directionArrow"
                    class="direction-arrow"
                >
                    →
                </div>

            </div>


            <!-- ROUTE NAME -->

            <div class="route-name">

                <span id="fromName">
                    -
                </span>

                <span class="route-arrow">
                    →
                </span>

                <span id="toName">
                    -
                </span>

            </div>


            <!-- RESULT DETAILS -->

            <div class="result-details">

                <!-- DISTANCE -->

                <div class="detail">

                    <div class="detail-icon">
                        📏
                    </div>

                    <div>

                        <div class="detail-label">
                            DISTANCE
                        </div>

                        <div
                            id="distanceValue"
                            class="detail-value"
                        >
                            -
                        </div>

                    </div>

                </div>


                <!-- BEARING -->

                <div class="detail">

                    <div class="detail-icon">
                        🧭
                    </div>

                    <div>

                        <div class="detail-label">
                            BEARING
                        </div>

                        <div
                            id="bearingValue"
                            class="detail-value"
                        >
                            -
                        </div>

                    </div>

                </div>


                <!-- COMPASS -->

                <div class="detail">

                    <div class="detail-icon">
                        ↗
                    </div>

                    <div>

                        <div class="detail-label">
                            HEADING
                        </div>

                        <div
                            id="compassValue"
                            class="detail-value"
                        >
                            -
                        </div>

                    </div>

                </div>

            </div>

        </div>


        <!-- =====================================
             FLIGHT LEVEL REMINDER
        ====================================== -->

        <div
            id="flightLevelCard"
            class="flight-level-card hidden"
        >

            <!-- HEADER -->

            <div class="flight-level-header">

                <div class="flight-level-icon">
                    ✈
                </div>

                <div>

                    <div class="result-label">
                        SEMICIRCULAR RULE REMINDER
                    </div>

                    <div
                        id="flightLevelDirection"
                        class="flight-level-direction"
                    >
                        -
                    </div>

                </div>

            </div>


            <!-- MESSAGE -->

            <div
                id="flightLevelMessage"
                class="flight-level-message"
            >
                -
            </div>


            <!-- FLIGHT LEVELS -->

            <div
                id="flightLevels"
                class="flight-levels"
            >
            </div>


            <!-- NOTE -->

            

        </div>


        <!-- =====================================
             LOADING
        ====================================== -->

        <div
            id="loading"
            class="loading hidden"
        >

            <div class="spinner"></div>

            <span>
                Calculating route...
            </span>

        </div>

    </main>


    <!-- =========================================
         LEAFLET JS
    ========================================== -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    ></script>


    <!-- =========================================
         YOUR JAVASCRIPT
    ========================================== -->

    <script src="app.js"></script>

</body>
</html>
